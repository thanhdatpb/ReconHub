server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Partner files are uploaded through the API (20 MB limit there).
    client_max_body_size 25m;

    # Resolve "api" through Docker's DNS on each request, so recreating the api container does not leave a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The assistant and AI suggestions can take a while when an LLM is configured.
        proxy_read_timeout 180s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
