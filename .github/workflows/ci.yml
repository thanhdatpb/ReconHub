name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  server:
    name: Server (unit + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test core, api, batch
        run: mvn -B -f server/pom.xml verify

  legacy-oms:
    name: Legacy OMS (WAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: VietQR copies in server/core and legacy-oms are identical
        run: bash scripts/check-vietqr-copies.sh
      - run: mvn -B -f legacy-oms/pom.xml package

  web:
    name: Web (type-check, mock and HTTP builds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:http

  e2e:
    name: End to end (Docker Compose + matching precision)
    runs-on: ubuntu-latest
    needs: [server, legacy-oms, web]
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the demo backfill
        run: |
          for i in $(seq 1 120); do
            if docker compose exec -T batch test -f /data/.backfilled; then echo "backfilled"; exit 0; fi
            sleep 5
          done
          docker compose logs batch | tail -100
          exit 1
      - name: Automatic matches must be 100% precise against the ground truth
        run: >
          docker compose run --rm --entrypoint python datagen eval_matching.py
          --truth /data/truth/truth.csv
          --db postgresql://reconhub:reconhub@postgres:5432/reconhub
          --min-precision 1.0
      - name: Smoke-test the API through Nginx and the legacy OMS
        run: |
          token=$(curl -sf -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"ha","password":"demo123"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          for path in meta dashboard exceptions files batch/executions aging sources; do
            curl -sf -o /dev/null -H "Authorization: Bearer $token" "localhost:8080/api/$path" && echo "ok /api/$path"
          done
          curl -sf -o /dev/null localhost:8088/oms/login.action && echo "ok legacy OMS"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
